name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Only review PRs opened by maintainers, so external PRs don't spend tokens
    if: contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)

    runs-on: ubuntu-latest
    # The job's GITHUB_TOKEN is the only GitHub credential the review gets
    # (github_token below), so these permissions bound what its gh and git
    # commands can do: read the code, comment on PRs, never push or merge.
    permissions:
      contents: read
      pull-requests: write
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Use the job token instead of exchanging OIDC for the Claude App's
          # token. That also skips the app's "workflow must match main" check,
          # so a PR that changes this file is reviewed by the changed version.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Nothing can approve a permission prompt here, so a denied tool call
          # just fails. Bash is off by default, and the model chains commands
          # (`gh pr diff > f; grep ...`, `gh api`, `git ls-files | grep`) that
          # prefix rules like Bash(gh pr diff:*) can't match, so all of Bash is
          # allowed; the token's permissions above are the real boundary.
          # Opus runs the plugin's subagent fan-out reliably; Sonnet, the
          # default, often skips it and answers "no issues" after a shallow
          # read. `gh pr review` stays denied so the bot can't approve or block.
          claude_args: >-
            --model opus
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash,Read,Glob,Grep,Agent"
            --disallowedTools "Edit,Write,NotebookEdit,WebFetch,WebSearch,Bash(gh pr review:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

