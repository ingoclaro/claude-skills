name: Claude Code Review

on:
  pull_request:
    # opened, ready_for_review and reopened get a full review. A push
    # (synchronize) gets a follow-up review of the commits since the last
    # successful review: it replies in the earlier unresolved threads, saying
    # whether each finding was addressed, and posts only new findings. For a
    # review on demand, comment `@claude` (claude.yml).
    types: [opened, synchronize, ready_for_review, reopened]

# Reviews of one PR queue instead of running at once and posting over each
# other. GitHub keeps only the newest queued run, but nothing is lost: a
# follow-up starts from the head of the last successful review, so it also
# covers pushes whose review was dropped from the queue or failed.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude-review:
    # Only review maintainers' PRs, so external PRs don't spend tokens or
    # reach a review that may run any Bash command. Skip drafts: they're
    # reviewed when marked ready.
    if: >-
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) &&
      !github.event.pull_request.draft

    runs-on: ubuntu-latest
    # The job's GITHUB_TOKEN is the only GitHub credential the review gets
    # (github_token below), so these permissions bound what its gh and git
    # commands can do: read the code, comment on PRs, never push or merge.
    # They don't allow resolving review threads either, so a person does.
    # actions: read is for finding the last successful review.
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      # The PR's head commit, not the merge commit checkout defaults to, so
      # line numbers read from the working tree match the lines inline
      # comments have to target. The prompt and render.py still come from the
      # merge commit, like this workflow file (see "Choose the review"). The whole history, so the review can diff
      # with git against the base branch and against the last reviewed head.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # Picks the review and renders .github/claude-review/review.md for it.
      # A push gets a follow-up of the commits since the head of the last
      # successful review of this PR, so commits whose review failed or was
      # dropped are still covered. A run counts only if its claude-review job
      # ran and succeeded: a run whose job was skipped (a draft) can still
      # report success. That needs such a review to exist and the PR to still
      # sit on the same base commit; if the lookup fails, it's a full review. After "Update branch" or
      # a rebase, the range would include the base branch's own changes, and
      # after a force push the old head may not be an ancestor, so those get
      # a full review, which skips findings that earlier threads already raise.
      - name: Choose the review
        id: plan
        env:
          ACTION: ${{ github.event.action }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          AFTER: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # checkout leaves only origin/<base>; the review diffs against <base>
          git branch -f "$BASE_REF" "origin/$BASE_REF"
          # The prompt and render.py from the merge commit ($GITHUB_SHA), the
          # same version as this workflow file, not from a possibly older head.
          cfg="$RUNNER_TEMP/claude-review"
          mkdir -p "$cfg"
          if git fetch -q --no-tags origin "$GITHUB_SHA"; then
            git show "$GITHUB_SHA:.github/claude-review/render.py" > "$cfg/render.py"
            git show "$GITHUB_SHA:.github/claude-review/review.md" > "$cfg/review.md"
          else
            echo "::warning::Couldn't fetch the merge commit, so the prompt comes from the PR head."
            cp .github/claude-review/render.py .github/claude-review/review.md "$cfg/"
          fi
          files="$RUNNER_TEMP/changed-files.txt"
          mode=full
          BEFORE=
          if [ "$ACTION" = synchronize ]; then
            # -f lets gh URL-encode the branch name, which may contain + & #
            runs=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/claude-code-review.yml/runs" \
                -f event=pull_request -f status=success -f branch="$HEAD_REF" -f per_page=20 \
                --jq '.workflow_runs[] | select(any(.pull_requests[]; .number == ($ENV.PR_NUMBER | tonumber))) | "\(.id) \(.head_sha)"') \
              || { echo "::warning::Couldn't list earlier reviews."; runs=; }
            while read -r id sha; do
              [ -n "$id" ] || continue
              job=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
                  --jq '.jobs[] | select(.name == "claude-review") | .conclusion') \
                || { echo "::warning::Couldn't read run $id."; break; }
              if [ "$job" = success ]; then BEFORE=$sha; break; fi
            done <<< "$runs"
            if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null && git merge-base --is-ancestor "$BEFORE" "$AFTER" \
                && [ "$(git merge-base "$BEFORE" "$BASE_REF")" = "$(git merge-base "$AFTER" "$BASE_REF")" ]; then
              mode=follow-up
            else
              echo "::notice::No earlier successful review, or the push rewrote history or brought in $BASE_REF, so this is a full review."
            fi
          fi
          if [ "$mode" = follow-up ]; then
            # -z gives the exact names: without it git quotes and escapes
            # paths with non-ASCII bytes, quotes, backslashes or control characters
            git diff -z --name-only "$BEFORE" "$AFTER" | tr '\0' '\n' > "$files"
          else
            # the files API pages through large PRs, where `gh pr diff` gives up
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' > "$files"
          fi
          prompt=$(MODE=$mode BEFORE=$BEFORE python3 "$cfg/render.py" "$cfg/review.md" "$files")
          echo "Review: $mode, $(wc -l < "$files") changed files"
          { echo "prompt<<PROMPT_EOF"; echo "$prompt"; echo "PROMPT_EOF"; } >> "$GITHUB_OUTPUT"

      # The env scrub below runs every Bash command in Claude Code's Linux
      # sandbox, which needs bubblewrap and socat; the runner image ships
      # neither. Ubuntu 24.04's AppArmor also blocks bwrap from creating user
      # namespaces, so this adds the profile the sandboxing docs give, which
      # unconfines bwrap only. Setup as in
      # https://code.claude.com/docs/en/sandboxing. The preflight runs bwrap
      # once so a broken sandbox fails here, with its real error, instead of
      # as a review in which every command fails.
      - name: Install the Bash sandbox
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat
          printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' \
            'profile bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' \
            '  include if exists <local/bwrap>' '}' | sudo tee /etc/apparmor.d/bwrap > /dev/null
          sudo systemctl reload apparmor
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid true && echo "bubblewrap works"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          # All of Bash is allowed below, so strip credentials (above all
          # CLAUDE_CODE_OAUTH_TOKEN) from the environment of every command
          # Claude runs. GITHUB_TOKEN stays, for gh, so the job permissions
          # above still matter. The action only sets this itself when
          # allowed_non_write_users is used.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Use the job token instead of exchanging OIDC for the Claude App's
          # token. That also skips the app's "workflow must match main" check,
          # so a PR that changes this file is reviewed by the changed version.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # .github/claude-review/review.md, rendered above. It runs Claude
          # Code's bundled code-review skill at high effort, not the older
          # code-review plugin (/code-review:code-review): the skill's effort
          # level trades confidence for coverage, where the plugin only
          # reported bugs that fail regardless of input.
          # https://code.claude.com/docs/en/code-review-local
          prompt: ${{ steps.plan.outputs.prompt }}
          # Nothing can approve a permission prompt here, so a denied tool call
          # just fails. Bash is off by default, and the model chains commands
          # (`gh pr diff > f; grep ...`, `gh api`, `git ls-files | grep`) that
          # prefix rules like Bash(gh pr diff:*) can't match, so all of Bash is
          # allowed; the token's permissions above are the real boundary.
          # Opus, because Sonnet, the default, cut multi-step reviews short
          # and answered "no issues" after a shallow read in local tests.
          # Denying `gh pr review` only stops the obvious way to approve:
          # `gh api .../reviews` still gets past it. What actually stops the
          # bot approving is the job token plus the repo's default setting
          # that doesn't let Actions approve pull requests.
          claude_args: >-
            --model opus
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash,Read,Glob,Grep,Agent,Skill"
            --disallowedTools "Edit,Write,NotebookEdit,WebFetch,WebSearch,Bash(gh pr review:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
